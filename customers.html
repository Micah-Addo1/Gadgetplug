<body>
    <h1>THANK YOU FOR YOUR ORDER</h1> 
    
    <title>Simple Forms and Tables</title>

<body>

    <h2>Forms</h2>
    
    <form>
        
        <label>Username:</label>
        <input type="text"><br><br>

        <label>Password:</label>
        <input type="password"><br><br>

        
        <input type="checkbox"> Subscribe<br><br>

     
        <button onclick="window.location.href='order.html'">Submit</button>
    </form>

    <hr>

        <tr>
            <th>Name</th>

            <th>City</th>
        </tr>

        </tr>

        
        <tr>
            <td>Nii</td>
            <td>23</td>

        </tr>

        
        <tr>
            <td>Jane</td>
            <td>45</td>
            <td>London</td>
        </tr>
        <tr>
            <td>Rose</td>

            <td>Paris</td>
        </tr>

    </table>


</body>
</html>
